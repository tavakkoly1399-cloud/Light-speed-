name: Build Light speed Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android platform
        run: flutter create --platforms=android .

      - name: Configure Android SDK
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
          fi

      - name: Verify VPN dependency and migrated config
        shell: bash
        run: |
          grep -q "flutter_singbox_client" pubspec.yaml
          ! grep -n "dns_mode" lib/main.dart
          ! grep -n "sniff_override_destination" lib/main.dart
          ! grep -n "domain_strategy" lib/main.dart
          ! grep -n "auto_detect_interface" lib/main.dart
          grep -n "override_android_vpn" lib/main.dart

      - name: Get packages
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Light-speed-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
