name: Build Light speed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android .

      - name: Configure Android for sing-box
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path('android/app/build.gradle.kts'),
              Path('android/app/build.gradle'),
          ]

          found = False

          for p in candidates:
              if not p.exists():
                  continue

              found = True
              s = p.read_text()

              # SDK versions required by the sing-box Flutter plugin.
              s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              s = s.replace('compileSdk flutter.compileSdkVersion', 'compileSdk 36')
              s = s.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')

              s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
              s = s.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')

              # Java/Kotlin 17.
              if 'compileOptions {' in s and 'sourceCompatibility' not in s:
                  s = s.replace(
                      'compileOptions {',
                      'compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17'
                  )

              if 'kotlinOptions {' in s and 'jvmTarget' not in s:
                  s = s.replace(
                      'kotlinOptions {',
                      'kotlinOptions {\n        jvmTarget = JavaVersion.VERSION_17.toString()'
                  )

              if 'compileOptions {' not in s:
                  marker = 'defaultConfig {'
                  if marker in s:
                      s = s.replace(
                          marker,
                          'compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n\n    ' + marker,
                          1,
                      )

              if 'kotlinOptions {' not in s:
                  marker = 'defaultConfig {'
                  if marker in s:
                      s = s.replace(
                          marker,
                          'kotlinOptions {\n        jvmTarget = JavaVersion.VERSION_17.toString()\n    }\n\n    ' + marker,
                          1,
                      )

              p.write_text(s)
              print(f'Configured {p}')
              break

          if not found:
              raise SystemExit('android/app/build.gradle(.kts) was not generated')
          PY

      - name: Check icon
        run: |
          test -f assets/icon/light_speed_icon.png || {
            echo "ERROR: assets/icon/light_speed_icon.png not found"
            exit 1
          }

      - name: Get packages
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Light-speed-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
