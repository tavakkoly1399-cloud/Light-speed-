name: Build Light speed PRO VPN

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android .

      - name: Remove ALL generated tests
        shell: bash
        run: |
          rm -rf test
          find . -type f -path '*/test/*' -delete 2>/dev/null || true

      - name: Verify no widget test remains
        shell: bash
        run: |
          if find . -type f -name 'widget_test.dart' | grep -q .; then
            echo "ERROR: widget_test.dart still exists"
            find . -type f -name 'widget_test.dart'
            exit 1
          fi

      - name: Verify sing-box dependency
        shell: bash
        run: |
          grep -q "flutter_singbox_client" pubspec.yaml || {
            echo "ERROR: flutter_singbox_client is missing from pubspec.yaml"
            exit 1
          }

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Light-speed-PRO-VPN
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
